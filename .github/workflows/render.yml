name: Record CaseMate demo
on: workflow_dispatch
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright google-genai
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-color-emoji
      - name: Record, narrate and capture
        run: python render.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save outputs
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in output/audio output/timeline.json output/CaseMate_Demo.mp4 output/shots output/live_log.json; do [ -e "$f" ] && git add "$f"; done
          git commit -m "Rendered outputs" || true
          git push || true
